<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-labelledby="title desc">
  <title id="title">NOVXIS horizontal brand lockup</title>
  <desc id="desc">The approved gold-and-phosphor X-Junction, the angular NOVXIS W3 Tech Stripe wordmark, and the tagline greater-than sign OBSERVE / VISUALIZE / EXPLORE.</desc>
  <!-- Self-contained icon and wordmark paths: no external image, script, or font file. -->
  <!-- The supporting tagline is editable text: IBM Plex Mono preferred, monospace fallback. -->
  <g id="selected-x-junction-icon" transform="translate(6,20) scale(0.105)">
    <g fill="#76D8DE">
      <path d="M200 200 H700 V350 H350 V700 H200 Z"/>
      <path d="M1300 200 H1800 V700 H1650 V350 H1300 Z"/>
      <path d="M200 1300 H350 V1650 H700 V1800 H200 Z"/>
      <path d="M1650 1300 H1800 V1800 H1300 V1650 H1650 Z"/>
    </g>
    <g fill="#AF9600">
      <path d="M420 420 H645 L835 610 V835 H610 L420 645 Z"/>
      <path d="M1580 420 H1355 L1165 610 V835 H1390 L1580 645 Z"/>
      <path d="M420 1580 H645 L835 1390 V1165 H610 L420 1355 Z"/>
      <path d="M1580 1580 H1355 L1165 1390 V1165 H1390 L1580 1355 Z"/>
    </g>
    <path fill="#88E6A1" d="M925 700 H1075 V925 H1300 V1075 H1075 V1300 H925 V1075 H700 V925 H925 Z"/>
  </g>
  <rect id="lockup-divider" x="247" y="36" width="4" height="176" fill="#E0E8E5"/>
  <g id="approved-w3-wordmark" transform="translate(293,43) scale(1.32)">
  <g id="w3-tech-stripe" fill="#AF9600">
    <path id="letter-N" transform="translate(0,0)" d="M0 72 V0 H16 L46 42 V0 H62 V72 H46 L16 30 V72 Z"/>
    <path id="letter-O" transform="translate(77,0)" d="M12 0 H52 L64 12 V60 L52 72 H12 L0 60 V12 Z M20 15 L15 20 V52 L20 57 H44 L49 52 V20 L44 15 Z" fill-rule="evenodd"/>
    <path id="letter-V" transform="translate(154,0)" d="M0 0 H17 L36 53 L55 0 H72 L46 72 H26 Z"/>
    <path id="letter-X" transform="translate(239,0)" d="M0 0 H19 L35 23 L51 0 H70 L47 36 L70 72 H51 L35 49 L19 72 H0 L23 36 Z"/>
    <path id="letter-I" transform="translate(320,0)" d="M0 0 H47 V14 H31 V58 H47 V72 H0 V58 H16 V14 H0 Z"/>
    <path id="letter-S" transform="translate(379,0)" d="M12 0 H64 V15 H17 L15 17 V25 L18 28 H51 L64 41 V60 L52 72 H0 V57 H47 L49 55 V46 L46 43 H13 L0 30 V12 Z"/>
    <!-- Two forward slashes, optically matched to the ~16-unit W3 letter strokes. -->
    <path id="stripe-1" d="M466 72 L491 0 H506 L481 72 Z"/>
    <path id="stripe-2" d="M502 72 L527 0 H542 L517 72 Z"/>
  </g>
  </g>
  <!-- The 29-character cyan phrase at 32px naturally nearly fills 555 SVG units
       in standard monospace (~0.6em/character). Use only minor spacing adjustment
       to align with the N–S letter width, leaving the two forward slashes beyond it.
       W3 name: x=293..877.76 after scale 1.32, tagline: x=293..878. -->
  <g id="brand-tagline" aria-label="&gt; OBSERVE / VISUALIZE / EXPLORE">
    <text x="293" y="200" font-size="32" font-weight="500" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" fill="#88E6A1">&gt;</text>
    <text x="323" y="200" textLength="555" lengthAdjust="spacing" font-size="32" font-weight="500" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" fill="#76D8DE">OBSERVE / VISUALIZE / EXPLORE</text>
  </g>
</svg>
