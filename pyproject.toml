[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "novxis"
version = "0.0.1"
description = "Network Observation, Visualization, eXploration Interface System"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "scapy>=2.8.0,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1,<10",
]

[project.scripts]
novxis-interfaces = "novxis.cli.interfaces:main"
novxis-capture = "novxis.cli.capture:main"
novxis-arp-capture = "novxis.cli.arp_capture:main"
novxis-arp-events = "novxis.cli.arp_events:main"
novxis-arp-replay = "novxis.cli.arp_replay:main"
novxis-arp-state-replay = "novxis.cli.arp_state_replay:main"
novxis-arp-state-live = "novxis.cli.arp_state_live:main"
novxis-ipv4-capture = "novxis.cli.ipv4_capture:main"
novxis-icmp-events = "novxis.cli.icmp_events:main"

[tool.setuptools.packages.find]
include = ["novxis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
